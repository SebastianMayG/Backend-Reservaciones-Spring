<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Reservación</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white !important;
            text-decoration: none;
            border-radius: 5px;
            margin: 15px 0;
        }
        .footer { margin-top: 30px; font-size: 0.9em; color: #777; }
    </style>
</head>
<body>
<div class="container">
    <h1>Necesitamos que verifique su reservación</h1>
    <p>Para verificar su reservación, por favor haga click en el siguiente enlace:</p>

    <a href="http://localhost:8080/TusReservaciones" class="button">
        Verificar reservación
    </a>

    <p class="footer">
        Si no ha solicitado una reservación, por favor ignore este mensaje.
    </p>
</div>
</body>
</html>
